services:
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--ui-port", "8080"]
    ports:
      - "7233:7233"
      - "8080:8080"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["node", "dist/server.js"]
    ports:
      - "3101:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TASK_QUEUE=hotel-offer-task-queue
      - SUPPLIER_A_ENABLED=true
      - SUPPLIER_B_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TASK_QUEUE=hotel-offer-task-queue
      - SUPPLIER_A_URL=http://api:3000/supplierA/hotels
      - SUPPLIER_B_URL=http://api:3000/supplierB/hotels
    depends_on:
      - api
      - temporal
      - redis
    restart: unless-stopped

volumes:
  redis_data:
